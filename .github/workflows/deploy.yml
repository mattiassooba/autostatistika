name: Deploy site

# Builds the static site (apps/web/out) and publishes it to GitHub Pages.
# Runs on pushes that touch the site, by hand, and from the ingest workflow
# after it commits a new bundle.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          # Latest commit on the branch, including a bundle the ingest job just pushed.
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Fetch the search index named in the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          asset=$(node -e "const b = require('./data/published/bundle.json'); console.log(b.registerIndex ? b.registerIndex.asset : '')")
          if [ -n "$asset" ]; then
            mkdir -p public/register
            gh release download register-index --repo "$GITHUB_REPOSITORY" --pattern "$asset" --output - | tar -x -C public/register
            ls public/register
          fi
      - run: npm test
      - run: npm run build
        env:
          # Trend-analyst Worker (workers/trend-analyst). Unset: the analysis shows computed text only.
          NEXT_PUBLIC_TREND_API_URL: ${{ vars.TREND_API_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Pre-writes the AI wording of the default trend card (newest month, every
  # vehicle type, et + en) so visitors get it from the Worker's cache at once.
  # Cached selections cost nothing; a new month costs about 16 model calls.
  prewarm:
    needs: deploy
    if: ${{ vars.TREND_API_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: workers/trend-analyst
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/trend-analyst/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/prewarm.ts "$TREND_API_URL"
        env:
          TREND_API_URL: ${{ vars.TREND_API_URL }}
